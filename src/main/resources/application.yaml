spring:
  application:
    name: gym-crm
  profiles:
    active: local
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
      jakarta:
        persistence:
          validation:
            mode: none
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml

security:
  jwt:
    expiration-ms: 3600000
    refresh-expiration-ms: 604800000
  cors:
    allowed-origins:
      - "*"
  admin:
    username: admin
    password-hash: "${ADMIN_PASSWORD_HASH:}"
    enabled: true
  service:
    subject: gym-crm-service
    expiration-ms: 60000

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

resilience4j:
  circuitbreaker:
    instances:
      trainerWorkload:
        registerHealthIndicator: true
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        failureRateTreshold: 50
        waitDurationOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 3

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
