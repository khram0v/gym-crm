spring:
  application:
    name: gym-crm
  profiles:
    active: local
  activemq:
    broker-url: ${ACTIVEMQ_BROKER_URL:tcp://localhost:61616}
    user: ${ACTIVEMQ_USER:admin}
    password: ${ACTIVEMQ_PASSWORD:admin}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
      jakarta:
        persistence:
          validation:
            mode: none
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml

security:
  jwt:
    expiration-ms: 3600000
    refresh-expiration-ms: 604800000
  cors:
    allowed-origins:
      - "*"
  admin:
    username: admin
    password-hash: "${ADMIN_PASSWORD_HASH:}"
    enabled: true

messaging:
  trainer-workload-events-queue: ${TRAINER_WORKLOAD_EVENTS_QUEUE:trainer-workload.events}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
