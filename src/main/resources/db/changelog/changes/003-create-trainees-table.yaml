databaseChangeLog:
  - changeSet:
      id: 003-create-trainees-table
      author: khram0v
      changes:
        - createTable:
            tableName: trainees
            columns:
              - column:
                  name: user_id
                  type: BIGINT
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: date_of_birth
                  type: DATE
              - column:
                  name: address
                  type: VARCHAR(255)
        - addForeignKeyConstraint:
            baseTableName: trainees
            baseColumnNames: user_id
            referencedTableName: users
            referencedColumnNames: id
            constraintName: fk_trainee_user
            onDelete: CASCADE
