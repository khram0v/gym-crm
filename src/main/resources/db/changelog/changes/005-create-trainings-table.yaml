databaseChangeLog:
  - changeSet:
      id: 005-create-trainings-table
      author: khram0v
      changes:
        - createTable:
            tableName: trainings
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: trainee_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: trainer_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: training_name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: training_type_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: training_date
                  type: DATE
                  constraints:
                    nullable: false
              - column:
                  name: training_duration
                  type: INTEGER
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            baseTableName: trainings
            baseColumnNames: trainee_id
            referencedTableName: trainees
            referencedColumnNames: user_id
            constraintName: fk_training_trainee
            onDelete: CASCADE
        - addForeignKeyConstraint:
            baseTableName: trainings
            baseColumnNames: trainer_id
            referencedTableName: trainers
            referencedColumnNames: user_id
            constraintName: fk_training_trainer
        - addForeignKeyConstraint:
            baseTableName: trainings
            baseColumnNames: training_type_id
            referencedTableName: training_types
            referencedColumnNames: id
            constraintName: fk_training_type
